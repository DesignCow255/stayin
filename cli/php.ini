; ---------------------------------------------------------------------------
; StayIn — CLI php.ini for MAMP / local development.
;
; MAMP's bundled php.ini makes every CLI invocation ~5s slow on macOS because it
; unconditionally loads imap/pgsql and points error_log at a slow path. The PHP
; 8.3 build already ships pdo_mysql, gd, intl, curl, mbstring and fileinfo as
; built-in modules, so an almost-empty ini is enough for CLI work.
;
; Usage:
;   /Applications/MAMP/bin/php/php8.3.14/bin/php -c cli/php.ini cli/stayin.php migrate
;
; This file only affects the CLI and is never used by Apache.
; ---------------------------------------------------------------------------

memory_limit = 512M
max_execution_time = 0
error_reporting = E_ALL
display_errors = On
log_errors = On
date.timezone = UTC

; Deterministic behaviour for CLI tooling.
default_charset = "UTF-8"
session.save_handler = files